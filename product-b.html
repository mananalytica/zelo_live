<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Zelo</title>
<meta name="description" content="Product detail page (A/B variant B).">
<link rel="icon" href="assets/logo-original-square.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main>

  <!-- Variant B — condensed layout, sticky buy bar, urgency framing -->
  <section class="container section-tight">
    <div class="grid grid-2" id="product-mount" style="align-items:start"></div>
  </section>
  <div class="card" id="sticky-buy" style="position:sticky;bottom:12px;max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:center;padding:14px 18px">
    <div style="flex:1">
      <div class="price" id="sticky-price" style="font-size:16px"></div>
      <div style="font-size:11px;color:var(--ink-faint)">Only a few left at this price</div>
    </div>
    <button class="btn btn-primary" onclick="zeloAddToCart(p.id)">Add to Cart</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const pid = params.get('id') || ZELO_PRODUCTS[0].id;
    const p = ZELO_PRODUCTS.find(x => x.id === pid) || ZELO_PRODUCTS[0];
    document.title = p.name + ' — Zelo (Variant B)';
    document.getElementById('sticky-price').textContent = 'Rs ' + p.price.toLocaleString();
    document.getElementById('product-mount').innerHTML = `
      <div class="card card-flush"><img src="${p.img}" style="aspect-ratio:4/5;object-fit:cover;width:100%"></div>
      <div>
        <span class="badge badge-danger">Selling Fast</span>
        <h1 style="margin:14px 0 8px">${p.name}</h1>
        <div class="price" style="font-size:26px;margin-bottom:6px">Rs ${p.price.toLocaleString()}</div>
        <p style="font-size:13px;color:var(--ink-faint);margin-bottom:14px">Free delivery on orders above Rs 5,000 · Same-day in Lahore</p>
        <div class="field"><label>Size</label>
          <select class="input" id="pdp-size"><option>S</option><option>M</option><option selected>L</option><option>XL</option></select>
        </div>
        <button class="btn btn-navy btn-block btn-lg" onclick="zeloAddToCart(p.id)">Add to Cart — Rs ${p.price.toLocaleString()}</button>
      </div>`;
  </script>

</main>
<div id="site-footer"></div>
<script src="script.js"></script>
<script src="consent.js"></script>
<script src="rudderstack.js"></script>

<script>
  const ZELO_PRODUCTS = [
    { id:'z1', name:'Charcoal Wool-Blend Overcoat', price:14500, img:'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=500&h=600&fit=crop&q=80', cat:'Menswear' },
    { id:'z2', name:'Winter Cotton Kurta', price:5500, img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500&h=600&fit=crop&q=80', cat:'Womenswear' },
    { id:'z3', name:'Unstitched Lawn — 3 Piece', price:8200, img:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500&h=600&fit=crop&q=80', cat:'Womenswear' },
    { id:'z4', name:'Dark Wash Denim Jacket', price:9800, img:'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=500&h=600&fit=crop&q=80', cat:'Menswear' },
    { id:'z5', name:'Kids Fleece Hoodie', price:4800, img:'https://images.unsplash.com/photo-1603252109303-27514432f5c3?w=500&h=600&fit=crop&q=80', cat:'Kids' },
    { id:'z6', name:'Genuine Leather Belt', price:12000, img:'https://images.unsplash.com/photo-1624222247344-550fb60583dc?w=500&h=600&fit=crop&q=80', cat:'Accessories' }
  ];
  function zeloAddToCart(id) {
    const p = ZELO_PRODUCTS.find(x => x.id === id);
    if (!p) return;
    const cart = Zelo.getCart();
    const existing = cart.find(i => i.id === id);
    if (existing) existing.qty += 1; else cart.push({ id: p.id, name: p.name, price: p.price, img: p.img, qty: 1 });
    Zelo.setCart(cart);
    Zelo.showToast('Added to Cart', p.name);
  }
</script>

</body>
</html>
