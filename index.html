<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zelo — Genuine Export-Leftover Fashion, Sold Live</title>
<meta name="description" content="Zelo Live Sell — genuine export-leftover garments from Zainab Export, sold live from the warehouse floor. Watch the feed, shop the drop, cash on delivery.">
<link rel="icon" href="assets/logo-original-square.png">
<link rel="stylesheet" href="styles.css">
<style>
  .hero { padding: 40px 0 0; border-bottom: 1px solid var(--line); }
  .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; }
  @media (max-width: 860px) { .hero-grid { grid-template-columns: 1fr; } }
  .hero-copy { padding: 60px 40px 60px 0; display: flex; flex-direction: column; justify-content: center; }
  @media (max-width: 860px) { .hero-copy { padding: 40px 0; } }
  .hero h1 { font-size: clamp(34px, 5.4vw, 58px); text-transform: uppercase; letter-spacing: -0.01em; margin-bottom: 18px; }
  .hero-visual { position: relative; aspect-ratio: 4/3; overflow: hidden; }
  .hero-visual img { width: 100%; height: 100%; object-fit: cover; }
  .hero-visual .tag { position: absolute; top: 16px; left: 16px; background: var(--red); color: #fff; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 10px; display: flex; align-items: center; gap: 6px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .feeds-strip { display: flex; gap: 1px; background: var(--line); overflow-x: auto; }
  .feed-card { flex: 0 0 260px; background: #fff; cursor: pointer; display: flex; flex-direction: column; }
  .feed-card .fimg { position: relative; aspect-ratio: 16/9; background: var(--stone); overflow: hidden; }
  .feed-card .fimg img { width: 100%; height: 100%; object-fit: cover; }
  .feed-card .finfo { padding: 12px; flex: 1; }
  .feed-card .ftitle { font-weight: 700; font-size: 12.5px; color: var(--black); margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: calc(1.35em * 2); }

  .catalog-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 24px 0; }
  #catalog-status { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }
</style>
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="hero">
    <div class="container">
      <div class="hero-grid">
        <div class="hero-copy">
          <span class="eyebrow">Zainab Export · Live Sell</span>
          <h1>Genuine export<br>leftovers. Live.</h1>
          <p class="lead" style="max-width:420px">Watch the warehouse floor, see the flaw before you buy, and check out with cash on delivery. Up to 70% off pieces that were already bound for export.</p>
          <div class="flex gap-md" style="margin-top:22px;flex-wrap:wrap">
            <a href="live-sell.html" class="btn btn-primary btn-lg">Watch Live</a>
            <a href="#catalog" class="btn btn-outline btn-lg">Shop All Products</a>
          </div>
        </div>
        <div class="hero-visual">
          <span class="tag"><span class="live-dot"></span> Live Now</span>
          <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=900&h=700&fit=crop&q=80" alt="Live warehouse floor">
        </div>
      </div>
    </div>
  </section>

  <section class="container section-tight">
    <div class="flex-between" style="margin-bottom:14px">
      <h2 style="margin:0;font-size:16px;text-transform:uppercase;letter-spacing:0.04em">Live Now</h2>
      <span id="feeds-status" class="order-ref"></span>
    </div>
    <div class="feeds-strip hide-scrollbar" id="feeds-strip"></div>
  </section>

  <section class="container" id="catalog">
    <div class="catalog-toolbar">
      <div class="pill-tab" id="category-filters">
        <button class="active" data-cat="all">All</button>
        <button data-cat="men">Men</button>
        <button data-cat="women">Women</button>
        <button data-cat="kids">Kids</button>
        <button data-cat="accessories">Accessories</button>
      </div>
      <span id="catalog-status">Loading products…</span>
    </div>
    <div class="grid grid-5 grid-nolines" id="product-grid"></div>
  </section>
</main>

<div id="site-footer"></div>
<script src="script.js"></script>
<script src="consent.js"></script>
<script src="rudderstack.js"></script>
<script>
  /* Fallback sample data — used only if /api/products or /api/live-feeds
     isn't reachable yet (e.g. MotherDuck/API not deployed in this preview). */
  const FALLBACK_PRODUCTS = [
    { id:'p1', name:'Export Overrun — Wool Blend Overcoat', price:4200, original_price:14500, stock:4, image:'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=500&h=650&fit=crop&q=80', category:'men' },
    { id:'p2', name:'Leftover Lawn Kurta — Winter Cotton', price:1800, original_price:5500, stock:12, image:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500&h=650&fit=crop&q=80', category:'women' },
    { id:'p3', name:'Export Seconds — Running Shoes', price:3900, original_price:12000, stock:2, image:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&h=650&fit=crop&q=80', category:'men' },
    { id:'p4', name:'Unstitched Lawn — 3 Piece Export Cut', price:2400, original_price:8200, stock:8, image:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500&h=650&fit=crop&q=80', category:'women' },
    { id:'p5', name:'Denim Jacket — Dark Wash Overrun', price:3200, original_price:9800, stock:15, image:'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=500&h=650&fit=crop&q=80', category:'men' },
    { id:'p6', name:'Export Leftover Tees — Bulk Lot', price:1100, original_price:4500, stock:3, image:'https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=500&h=650&fit=crop&q=80', category:'men' },
    { id:'p7', name:'Kids Winter Hoodie — Mixed Pack', price:1500, original_price:4800, stock:20, image:'https://images.unsplash.com/photo-1603252109303-27514432f5c3?w=500&h=650&fit=crop&q=80', category:'kids' },
    { id:'p8', name:'Leather Belt — Export Defect', price:8500, original_price:45000, stock:1, image:'https://images.unsplash.com/photo-1624222247344-550fb60583dc?w=500&h=650&fit=crop&q=80', category:'accessories' }
  ];
  const FALLBACK_FEEDS = [
    { id:'stream-001', title:'Warehouse Floor — Export Leftover Sorting', host:'Zainab Export', viewers: 1247, thumbnail:'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500&h=280&fit=crop&q=80' }
  ];

  let ALL_PRODUCTS = [];

  function renderProductCard(p) {
    const price = p.price, orig = p.original_price || p.originalPrice || p.price;
    const pct = orig > price ? Math.round((1 - price / orig) * 100) : 0;
    return `
      <div class="pcard" onclick="trackAndGo('${p.id}')">
        <div class="pimg-wrap">
          <img src="${p.image}" loading="lazy">
          ${p.stock <= 3 ? '<span class="badge badge-red" style="position:absolute;top:8px;left:8px">Low Stock</span>' : ''}
        </div>
        <div class="pinfo">
          <div class="pbrand">Zainab Export</div>
          <div class="pname">${p.name}</div>
          <div class="pprice">
            <span class="price">Rs ${Number(price).toLocaleString()}</span>
            ${pct > 0 ? `<span class="price-strike">Rs ${Number(orig).toLocaleString()}</span><span class="order-ref" style="color:var(--red)">-${pct}%</span>` : ''}
          </div>
        </div>
      </div>`;
  }

  function trackAndGo(pid) {
    const p = ALL_PRODUCTS.find(x => x.id === pid);
    if (window.ZeloAnalytics && p) {
      ZeloAnalytics.track('Product Clicked', { product_id: p.id, sku: p.sku || p.id, name: p.name, price: p.price, category: p.category, currency: 'PKR' });
    }
    window.location.href = 'product.html?id=' + pid;
  }

  function renderProducts(list) {
    document.getElementById('product-grid').innerHTML = list.map(renderProductCard).join('');
  }

  function filterCategory(cat) {
    document.querySelectorAll('#category-filters button').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
    renderProducts(cat === 'all' ? ALL_PRODUCTS : ALL_PRODUCTS.filter(p => p.category === cat));
  }
  document.querySelectorAll('#category-filters button').forEach(b => b.addEventListener('click', () => filterCategory(b.dataset.cat)));

  function renderFeedCard(f) {
    return `
      <a class="feed-card" href="live-sell.html">
        <div class="fimg">
          <img src="${f.thumbnail || 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500&h=280&fit=crop&q=80'}">
          <span class="badge badge-red" style="position:absolute;top:8px;left:8px"><span class="live-dot" style="width:5px;height:5px;background:#fff"></span> Live</span>
        </div>
        <div class="finfo">
          <div class="ftitle">${f.title}</div>
          <div class="order-ref">${f.host} · ${(f.viewers||0).toLocaleString()} watching</div>
        </div>
      </a>`;
  }

  Zelo.api.products()
    .then(res => {
      ALL_PRODUCTS = res.products && res.products.length ? res.products : FALLBACK_PRODUCTS;
      document.getElementById('catalog-status').textContent = res.products && res.products.length ? 'LIVE FROM DATABASE' : 'SAMPLE DATA — CONNECT API';
      renderProducts(ALL_PRODUCTS);
      if (window.ZeloAnalytics) ZeloAnalytics.track('Product List Viewed', { list_id: 'homepage_catalog', currency: 'PKR', products: ALL_PRODUCTS.map(p => ({ product_id: p.id, sku: p.sku || p.id, name: p.name, price: p.price, category: p.category })) });
    })
    .catch(() => {
      ALL_PRODUCTS = FALLBACK_PRODUCTS;
      document.getElementById('catalog-status').textContent = 'SAMPLE DATA — CONNECT API';
      renderProducts(ALL_PRODUCTS);
      if (window.ZeloAnalytics) ZeloAnalytics.track('Product List Viewed', { list_id: 'homepage_catalog', currency: 'PKR', products: ALL_PRODUCTS.map(p => ({ product_id: p.id, sku: p.sku || p.id, name: p.name, price: p.price, category: p.category })) });
    });

  Zelo.api.liveFeeds()
    .then(res => { const feeds = res.feeds && res.feeds.length ? res.feeds : FALLBACK_FEEDS; document.getElementById('feeds-status').textContent = res.feeds && res.feeds.length ? '' : 'Sample feed'; document.getElementById('feeds-strip').innerHTML = feeds.map(renderFeedCard).join(''); })
    .catch(() => { document.getElementById('feeds-status').textContent = 'Sample feed'; document.getElementById('feeds-strip').innerHTML = FALLBACK_FEEDS.map(renderFeedCard).join(''); });
</script>
</body>
</html>
