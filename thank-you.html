<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Confirmed — Zelo</title>
<meta name="description" content="Your order has been placed.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo-original-square.png">
<script src="datalayer.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main>
  <section class="page-hero container">
    <span class="eyebrow">Order Confirmed</span>
    <h1>Thank you — it's on its way.</h1>
    <p class="lead" id="ty-lead">We'll call to confirm your delivery window shortly.</p>
  </section>
  <section class="container section-tight" style="max-width:560px">
    <div class="card">
      <div class="text-center" style="margin-bottom:20px">
        <p style="font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin-bottom:4px">Order Reference</p>
        <p class="order-ref" id="ty-ref" style="font-size:22px;color:var(--black);font-weight:700">—</p>
        <p class="order-ref" id="ty-date"></p>
      </div>
      <hr class="rule" style="margin-bottom:18px">

      <div id="ty-items" style="margin-bottom:14px"></div>
      <hr class="rule" style="margin:14px 0">
      <div class="flex-between" style="margin-bottom:6px"><span style="font-size:13px">Subtotal</span><span class="price mono" id="ty-subtotal">Rs 0</span></div>
      <div class="flex-between" style="margin-bottom:6px"><span style="font-size:13px">Delivery</span><span class="price mono" id="ty-shipping">Free</span></div>
      <hr class="rule" style="margin:14px 0">
      <div class="flex-between"><strong style="font-size:13px;text-transform:uppercase;letter-spacing:0.03em">Total</strong><span class="price" id="ty-total" style="font-size:18px">Rs 0</span></div>

      <hr class="rule" style="margin:20px 0">
      <h4 style="font-size:12.5px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:12px">Delivery To</h4>
      <div id="ty-customer" style="font-size:13px;line-height:1.7;color:var(--ink-soft)"></div>
    </div>

    <div class="flex gap-md" style="justify-content:center;margin-top:24px">
      <a href="index.html" class="btn btn-outline">Continue Shopping</a>
      <a href="live-sell.html" class="btn btn-primary">Watch Live Sell</a>
    </div>
  </section>
</main>
<div id="site-footer"></div>

<script src="script.js"></script>
<script src="consent.js"></script>
<script src="rudderstack.js"></script>
<script>
  const raw = sessionStorage.getItem('zelo_last_order');
  if (raw) {
    const order = JSON.parse(raw);
    document.getElementById('ty-ref').textContent = order.ref;
    if (order.placedAt) {
      document.getElementById('ty-date').textContent = new Date(order.placedAt).toLocaleString('en-PK', { dateStyle: 'medium', timeStyle: 'short' });
    }
    document.getElementById('ty-items').innerHTML = order.cart.map(i => `
      <div class="flex gap-md" style="align-items:flex-start;margin-bottom:12px">
        <img src="${i.img || i.image || ''}" style="width:48px;height:60px;object-fit:cover;border:1px solid var(--line);flex-shrink:0">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--black)">${i.name}</div>
          <div class="order-ref">${i.size ? 'Size ' + i.size + ' · ' : ''}Qty ${i.qty}</div>
        </div>
        <span class="price mono">Rs ${(i.price*i.qty).toLocaleString()}</span>
      </div>`).join('');
    document.getElementById('ty-subtotal').textContent = 'Rs ' + (order.subtotal || order.total).toLocaleString();
    document.getElementById('ty-shipping').textContent = order.shipping ? 'Rs ' + order.shipping.toLocaleString() : 'Free';
    document.getElementById('ty-total').textContent = 'Rs ' + order.total.toLocaleString();

    if (order.customer) {
      const c = order.customer;
      document.getElementById('ty-customer').innerHTML = `
        <strong style="color:var(--black)">${c.name || ''}</strong><br>
        ${c.address || ''}<br>
        ${c.city || ''}${c.city && c.province ? ', ' : ''}${c.province || ''} ${c.postalCode || ''}<br>
        ${c.country || ''}<br>
        ${c.phone || ''}${c.email ? ' · ' + c.email : ''}<br>
        <span style="color:var(--black)">${c.shippingMethod === 'standard' ? 'Standard Delivery (2–4 days)' : 'Same-Day Delivery — Lahore'}</span> · Payment: ${c.payment || 'Cash on Delivery'}`;
    }
  } else {
    document.getElementById('ty-ref').textContent = 'No recent order found';
    document.getElementById('ty-lead').textContent = 'We couldn\'t find a recent order in this browser session.';
  }
</script>
</body>
</html>
