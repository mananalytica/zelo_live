<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Zelo</title>
<meta name="description" content="Site administration.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo-original-square.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main>
  <section class="page-hero container">
    <span class="eyebrow">Restricted</span>
    <h1>Admin</h1>
    <p class="lead">Enter the admin key (the same value as the <span class="mono">ADMIN_KEY</span> environment variable on the API) to manage products, CSV imports, and live feeds.</p>
  </section>
  <section class="container section-tight" style="max-width:420px">
    <div class="card">
      <form id="admin-form" onsubmit="return goToAdmin(event)">
        <div class="field"><label>Admin Key</label><input class="input mono" id="admin-key" type="password" placeholder="X-Admin-Key value" required></div>
        <button class="btn btn-primary btn-block" type="submit">Continue to Admin Panel</button>
      </form>
      <p style="font-size:11px;color:var(--ink-faint);margin-top:14px">Product management, CSV bulk upload, and live-feed controls live inside the Live Sell admin panel.</p>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="script.js"></script>
<script src="consent.js"></script>
<script src="rudderstack.js"></script>
<script>
  function goToAdmin(e) {
    e.preventDefault();
    Zelo.setAdminKey(document.getElementById('admin-key').value);
    window.location.href = 'live-sell.html#admin';
    return false;
  }
</script>
</body>
</html>
