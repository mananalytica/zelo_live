<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Fitting — Zelo</title>
<meta name="description" content="Book an in-person or video fitting with a Zelo tailor.">
<link rel="icon" href="assets/logo-original-square.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main>

  <section class="page-hero container">
    <span class="eyebrow">Book a Fitting</span>
    <h1>Pick a time.<br>We'll bring the tape.</h1>
    <p class="lead">In-studio in Lahore, or over video call anywhere else — either way, it takes about 15 minutes.</p>
  </section>
  <section class="container section-tight" style="max-width:520px">
    <div class="card">
      <form id="booking-form" onsubmit="event.preventDefault(); Zelo.showToast('Fitting requested','We\'ll confirm your slot by phone within a few hours.'); this.reset();">
        <div class="field"><label>Full Name</label><input class="input" type="text" required></div>
        <div class="field"><label>Phone Number</label><input class="input mono" type="tel" placeholder="03XX-XXXXXXX" required></div>
        <div class="grid grid-2">
          <div class="field"><label>Preferred Date</label><input class="input" type="date" required></div>
          <div class="field"><label>Format</label>
            <select class="input">
              <option>In-Studio — Lahore</option>
              <option>Video Call</option>
            </select>
          </div>
        </div>
        <div class="field"><label>What's this for?</label>
          <select class="input">
            <option>Made-to-Measure Order</option>
            <option>Design Studio Consultation</option>
            <option>Alterations</option>
          </select>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Request Fitting</button>
      </form>
    </div>
  </section>
  
</main>
<div id="site-footer"></div>
<script src="script.js"></script>
<script src="consent.js"></script>
<script src="rudderstack.js"></script>

</body>
</html>
