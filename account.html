<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — Zelo</title>
<meta name="description" content="View your saved measurements, past orders, and live-sell purchases in one place.">
<link rel="icon" href="assets/logo-original-square.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main>

  <section class="page-hero container">
    <span class="eyebrow">Account</span>
    <h1>Welcome back.</h1>
    <p class="lead">Sign in to see your saved measurements, order history, and live-sell purchases.</p>
  </section>
  <section class="container" style="max-width:420px;padding-bottom:64px">
    <div class="card">
      <form onsubmit="event.preventDefault(); Zelo.showToast('Signed in','This is a design preview — no live accounts yet.')">
        <div class="field"><label>Email or Phone</label><input class="input" type="text" placeholder="you@email.com" required></div>
        <div class="field"><label>Password</label><input class="input" type="password" placeholder="********" required></div>
        <button class="btn btn-navy btn-block" type="submit">Sign In</button>
      </form>
      <hr class="seam seam-tight">
      <p style="text-align:center;font-size:13px">New here? <a href="booking.html" style="color:var(--blue-deep);font-weight:700">Book a fitting</a> to start an account.</p>
    </div>
  </section>
  
</main>
<div id="site-footer"></div>
<script src="script.js"></script>
<script src="consent.js"></script>
<script src="rudderstack.js"></script>

</body>
</html>
